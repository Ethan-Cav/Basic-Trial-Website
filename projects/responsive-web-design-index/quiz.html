<!DOCTYPE html>

<html lang="en">

 <head>
    <title>QUIZ</title>
	<link rel="stylesheet" href="../../back/work-with-me.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Quiz in order to pratice my radio and checkbox skills.">
  <meta name="Author" content="Ethan Cavanagh">
  <title>Quiz</title>
  
 </head>
 


 <body>
  <div class="page">
  
  <h1>QUIZ</h1>
   <P>This quiz is simply a practice and still in the works, feel free to send me any potential feedback via my email on the main page.</P>

  <form action="../../back/results.html" method="get">
  
  <!-- Question 1 Radio -->
  <fieldset>
  
   <legend>1. What is the capital of france?</legend>
   <label for="Q1a"><input type="radio" name="Q1" value="paris" id="Q1a" class="inline"> Paris</label>
   
   <label for="Q1b"><input checked type="radio" name="Q1" value="rome" id="Q1b" class="inline"> Rome</label>
  
  </fieldset>
  
  <br>
  
  <!-- Question 2 Radio -->
  <fieldset>
  
   <legend>2. Which planet is known as the red planet?</legend>
   <label for="Q2a"><input type="radio" name="Q2" value="mars" id="Q2a" class="inline"> Mars</label>
   
   <label for="Q2b"><input checked type="radio" name="Q2" value="venus" id="Q2b" class="inline"> Venus</label>   
  
  </fieldset>
  
  <br>
  
  <!-- Question 3 Checkbox -->
  <fieldset>
  
   <legend>3. Which of these are programming languages?</legend>
   <label for="Q3a"><input type="checkbox" name="Q3" value="HTML" id="Q3a" class="inline"> HTML</label>
   
   <label for="Q3b"><input type="checkbox" name="Q3" value="CSS" id="Q3b" class="inline"> CSS</label>
   
   <label for="Q3c"><input checked type="checkbox" name="Q3" value="Banana" id="Q3c" class="inline"> Bananas</label>
   
  </fieldset>
  
  <!-- Question 4 Checkbox -->
  <fieldset>
  
  <Legend>4. Select the Animals</Legend>
  <label for="Q4a"><input type="checkbox" name="Q4" value="Cat" id="Q4a" class="inline"> Cat</label>
  
  <label for="Q4b"><input type="checkbox" name="Q4" value="Dog" id="Q4b" class="inline"> Dog</label>
  
  <label for="Q4c"><input checked type="checkbox" name="Q4" value="A-10 Warthog" id="Q4c" class="inline"> A-10 Warthog</label>
  
  </fieldset>
  
  <br>
  
    <input type="submit" value="Submit">
  
  </form>

	
  </div>
 </body>

</html>
